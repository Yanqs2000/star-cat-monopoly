<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星猫 · 透明素材与接入验证</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2f4;color:#233740;font:16px/1.7 system-ui,"PingFang SC",sans-serif}main{max-width:1200px;margin:auto;padding:30px 20px}h1{margin:0}a{color:#176678}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button,a.action{font:inherit;padding:8px 16px;background:white;border:1px solid #a5bbc3;border-radius:8px;cursor:pointer}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}figure{margin:0;background:white;border-radius:12px;overflow:hidden;border:1px solid #bdced6}img{width:100%;height:290px;object-fit:contain;display:block;background:var(--back,#fff)}figcaption{padding:10px 14px}small{display:block;color:#58717d}.note{background:#fff3d4;padding:14px 18px}ruffle-player{width:800px;max-width:100%;height:400px;display:block;background:#a8dded}#preview{display:none}#preview.open{display:block}</style>
<main><h1>透明素材与接入验证</h1><p>23 张 RGBA PNG，保留黑色眼睛与内部深色细节。点击图片下载或查看原尺寸。</p><p class="note">静态建筑已打包至独立试用版。人物只有代表帧完成抠图，完整动作尚未高清化；下方渲染样本用于检查人物与建筑的透明、大小和位置。</p>
<nav><a class="action" href="../?art=hd" target="_blank">打开高清建筑试用版</a><a class="action" href="../hd-review/">原图对照</a><button data-color="#ffffff">白底</button><button data-color="#172630">深底</button><button data-color="#68c9ad">绿底</button><button id="character">查看游戏播放器渲染样本</button></nav><section id="preview"><p>直接使用替换后的 SWF 位图与形状，在游戏播放器中渲染；左侧建筑，右侧卷毛。</p><div id="player"></div></section><div id="grid"></div><p><a href="manifest.json">透明通道与替换清单</a></p></main>
<script>
const labels={juanmao:'卷毛',aniu:'阿牛',jijimimi:'吉吉米米',jiajia:'佳佳',dapai:'大牌',weiwei:'薇薇',shuaige:'帅戈',dawei:'大尾',afei:'阿飞',ajie:'阿杰',guaika:'怪卡',nini:'妮妮',building:'建筑 178'};
fetch('manifest.json').then(r=>{if(!r.ok)throw Error('清单加载失败');return r.json()}).then(m=>{for(const item of m.assets){const figure=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),cap=document.createElement('figcaption'),small=document.createElement('small');a.href=item.key+'.png';a.target='_blank';img.src=a.href;img.alt=labels[item.key]||item.key.replace('building-','建筑 ');cap.textContent=img.alt;small.textContent=item.width+' × '+item.height+' · RGBA';cap.append(small);a.append(img);figure.append(a,cap);document.querySelector('#grid').append(figure)}}).catch(e=>document.querySelector('#grid').textContent=e.message);
for(const button of document.querySelectorAll('[data-color]'))button.onclick=()=>document.documentElement.style.setProperty('--back',button.dataset.color);
document.querySelector('#character').onclick=async()=>{document.querySelector('#preview').classList.add('open');if(document.querySelector('ruffle-player'))return;window.RufflePlayer={config:{polyfills:false,publicPath:'../ruffle/'}};await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='../ruffle/ruffle.js';script.onload=resolve;script.onerror=reject;document.head.append(script)});const p=window.RufflePlayer.newest().createPlayer();document.querySelector('#player').append(p);await p.ruffle().load({url:'render-check.swf',autoplay:'on',unmuteOverlay:'hidden',backgroundColor:'#a8dded',scale:'showAll',splashScreen:false,allowScriptAccess:false,openUrlMode:'deny'});};
</script></html>
