<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星猫大富翁 · 高清素材对照</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:#1c2b33;font-family:system-ui,"PingFang SC",sans-serif;line-height:1.7}main{max-width:1200px;margin:auto;padding:36px 20px}h1{font-size:30px;margin:0}p{color:#50616b}.note{padding:16px;background:#fff6df;border-left:4px solid #d59a30}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{padding:9px 22px;border:1px solid #b9c9ce;border-radius:24px;background:white;cursor:pointer;color:#234855}button[aria-pressed=true]{background:#234855;color:white}#gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}article{min-width:0;background:white;border:1px solid #dce3e7;border-radius:14px;overflow:hidden}h2{font-size:18px;padding:14px 18px;margin:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#263238}figure{margin:0;min-width:0}img{display:block;width:100%;height:300px;object-fit:contain;background:black}figcaption{background:white;padding:9px 12px;font-size:13px}small{display:block;color:#647681}a{color:#246880}footer{margin-top:30px;font-size:13px}article[hidden]{display:none}@media(max-width:700px){#gallery{grid-template-columns:1fr}main{padding:24px 12px}h1{font-size:25px}img{height:260px}}</style></head>
<body><main><h1>星猫大富翁 · 高清素材对照</h1><p>12 位人物代表帧 · 11 张建筑素材。沿用已确认的生成式高清风格，与原版素材并排查看。</p>
<p class="note">这里保留黑底生成原图供对照。23 张素材已生成透明版，11 张建筑已接入独立试用版；人物整套动画尚未高清化。五官、材质和局部轮廓存在生成式重构。</p>
<p><a href="../hd-assets/">查看透明素材与播放器渲染样本</a> · <a href="../?art=hd" target="_blank">打开高清建筑试用版</a></p><nav aria-label="素材分类"><button data-filter="all" aria-pressed="true">全部 23</button><button data-filter="character" aria-pressed="false">人物 12</button><button data-filter="building" aria-pressed="false">建筑 11</button></nav><div id="gallery"></div>
<footer>点击图片查看完整分辨率。生成方式：内置 image_gen，工具未提供底层型号选择。<a href="batch-manifest.json">本批素材与完整提示词</a> · <a href="prompts.md">首批样张记录</a> · <a href="../">返回原版游戏</a></footer>
<script>
const names=[['juanmao','卷毛','character'],['aniu','阿牛','character'],['jijimimi','吉吉米米','character'],['jiajia','佳佳','character'],['dapai','大牌','character'],['weiwei','薇薇','character'],['shuaige','帅戈','character'],['dawei','大尾','character'],['afei','阿飞','character'],['ajie','阿杰','character'],['guaika','怪卡','character'],['nini','妮妮','character'],['building','建筑 178','building'],...[181,187,190,193,196,199,202,205,208,211].map(n=>['building-'+n,'建筑 '+n,'building'])];
for(const [key,name,type] of names){const card=document.createElement('article');card.dataset.type=type;const title=document.createElement('h2');title.textContent=name;card.append(title);const pair=document.createElement('div');pair.className='pair';for(const [suffix,label] of [['original.jpg','原版'],['hd-candidate.png','高清']]){const figure=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),cap=document.createElement('figcaption'),size=document.createElement('small');a.href=key+'-'+suffix;a.target='_blank';a.rel='noopener';img.src=a.href;img.alt=name+' · '+label;img.onload=()=>size.textContent=img.naturalWidth+' × '+img.naturalHeight;cap.textContent=label;cap.append(size);a.append(img);figure.append(a,cap);pair.append(figure)}card.append(pair);document.querySelector('#gallery').append(card)}
for(const button of document.querySelectorAll('button'))button.onclick=()=>{for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b===button));for(const c of document.querySelectorAll('article'))c.hidden=button.dataset.filter!=='all'&&c.dataset.type!==button.dataset.filter};
</script></main></body></html>
