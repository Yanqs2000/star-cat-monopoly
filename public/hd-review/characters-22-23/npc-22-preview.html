<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><title>22 NPC 连续候选</title>
<style>body{margin:0;background:#e5edf0;color:#173440;font:16px system-ui}header{position:sticky;top:0;background:#173440;color:white;padding:16px;z-index:1}button,input{font:inherit}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;padding:12px}.card{background:white;border-radius:12px;text-align:center;padding:8px}canvas{display:block;width:100%;height:auto}small{display:block}input{width:240px}</style>
<header>22 NPC 连续候选 · 未用户验收 <button id="pause">暂停</button> <label>时钟 <input id="clock" type="range" min="0" max="36000" value="0"></label> <span id="time"></span><small>主体为新关键姿态的位移补帧；影子与外层浮动独立。Flash循环是否重置内层仍待原版实跑。</small></header><div id="cards"></div>
<script type="module">
const data=await(await fetch('./npc-22-runtime.json')).json(),images=new Map(),motion=new Map(data.motion.map(m=>[m.id,m]));
let loadIndex=0;await Promise.all(Array.from({length:6},async()=>{while(loadIndex<data.runtimeImages.length){const item=data.runtimeImages[loadIndex++],im=new Image();im.src='../../modern/'+item.url;await im.decode();images.set(item.url,im)}}));
const cards=data.worldClips.map(clip=>{const card=document.createElement('section');card.className='card';card.innerHTML=`<b>${clip.id}</b><canvas width="600" height="570"></canvas><small>${clip.frames.length}显示帧 / ${new Set(clip.frames.map(f=>f.url)).size}共享纹理</small>`;document.querySelector('#cards').append(card);return{clip,canvas:card.querySelector('canvas')}});
let paused=false,elapsed=0,last;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'播放':'暂停'};document.querySelector('#clock').oninput=e=>{paused=true;elapsed=+e.target.value;document.querySelector('#pause').textContent='播放';draw()};
function draw(){for(const{clip,canvas}of cards){const ctx=canvas.getContext('2d'),m=motion.get(clip.id),frame=clip.frames[Math.floor(elapsed*clip.fps/1000)%clip.frames.length],q=elapsed*m.outerFps/1000,i=Math.floor(q),a=m.outerTrack[i%m.outerTrack.length],b=m.outerTrack[(i+1)%m.outerTrack.length],t=q-i,mix=k=>a[k]+(b[k]-a[k])*t;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,600,570);ctx.scale(3,3);ctx.translate(85,130);ctx.save();ctx.translate(mix('shadowX'),mix('shadowY'));ctx.scale(mix('shadowScaleX'),mix('shadowScaleY'));const g=ctx.createRadialGradient(0,0,0,0,0,25.25);g.addColorStop(0,'#0009');g.addColorStop(.35,'#0006');g.addColorStop(.72,'#0002');g.addColorStop(1,'#0000');ctx.fillStyle=g;ctx.fillRect(-25.25,-25.25,50.5,50.5);ctx.restore();ctx.drawImage(images.get(frame.url),frame.offsetX+mix('x'),frame.offsetY+mix('y'),frame.width,frame.height)}document.querySelector('#time').textContent=(elapsed/1000).toFixed(2)+'s'}
function tick(now){if(last!==undefined&&!paused)elapsed+=now-last;last=now;draw();requestAnimationFrame(tick)};requestAnimationFrame(tick);window.Npc22Preview={data,get elapsed(){return elapsed},setTime(value){elapsed=value;paused=true;draw()}};
</script>
