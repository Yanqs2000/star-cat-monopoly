<!doctype html><meta charset="utf-8"><title>05—12 候选总览</title><style>*{box-sizing:border-box}body{margin:0;width:1300px;background:#edf3f8;color:#193f5e;font:15px/1.5 system-ui,"PingFang SC",sans-serif}main{padding:28px}h1{font-size:29px;margin:2px 0 8px}header p{color:#67839c;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:1px solid #d1e0ec;border-radius:14px;background:white;padding:16px;min-height:290px;overflow:hidden}.card h2{font-size:18px;margin:0 0 10px}.card small{font-size:11px;color:#7390a4;font-weight:400;margin-left:12px}.art{height:235px;position:relative;display:flex;align-items:center;justify-content:center;gap:13px;overflow:hidden;border-radius:8px;background-color:#fafcfd;background-image:linear-gradient(45deg,#e6edf3 25%,transparent 25%),linear-gradient(-45deg,#e6edf3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6edf3 75%),linear-gradient(-45deg,transparent 75%,#e6edf3 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.art>img{max-width:95%;max-height:210px;object-fit:contain}.view,.tile,.crop{position:relative;overflow:hidden;flex:none}.view img,.tile img,.crop img,.tile{position:absolute;max-width:none}.holder{position:relative;flex:none}.view{transform-origin:top left}footer{text-align:center;padding:18px;font-size:12px;color:#6f889b}</style><main><header><h1>非人物素材 05—12 · 候选总览</h1><p>已保留原版造型与播放顺序的制作依据 · 当前待美术验收，尚未接入游戏 · 动态效果见联合审阅页</p></header><div class="grid" id="grid"></div><footer>07—09 使用原SWF矢量4倍导出；其他项使用GPT内置生图。母版原始像素与透明通道保留。</footer></main><script src="data.js"></script><script>
const data=window.reviewData,grid=document.getElementById('grid');function card(n,title,method){const c=document.createElement('section');c.className='card';const h=document.createElement('h2');h.textContent=String(n).padStart(2,'0')+' '+title;const s=document.createElement('small');s.textContent=method;h.append(s);const art=document.createElement('div');art.className='art';c.append(h,art);grid.append(c);return art;}
function pose(parent,id,index,z){const c=data.clips.find(c=>c.id===id),p=c.candidatePoses[index],o=c.originalPoses[index];if(!p.bounds)return;const b=p.bounds,s=o.bounds,sx=(s[2]-s[0])/(b[2]-b[0]),sy=(s[3]-s[1])/(b[3]-b[1]),cell=p.cell||[0,0,...p.size];const hold=document.createElement('div');hold.className='holder';Object.assign(hold.style,{width:o.size[0]*z+'px',height:o.size[1]*z+'px'});const v=document.createElement('div');v.className='view';Object.assign(v.style,{width:o.size[0]+'px',height:o.size[1]+'px',transform:'scale('+z+')'});const tile=document.createElement('div');tile.className='tile';Object.assign(tile.style,{left:s[0]+'px',top:s[1]+'px',width:(b[2]-b[0])*sx+'px',height:(b[3]-b[1])*sy+'px'});const im=new Image();im.src=p.url;Object.assign(im.style,{width:p.size[0]*sx+'px',height:p.size[1]*sy+'px',left:-(cell[0]+b[0])*sx+'px',top:-(cell[1]+b[1])*sy+'px'});tile.append(im);v.append(tile);hold.append(v);parent.append(hold);}
const rail=data.statics[0],a=card(5,'手牌栏背景','GPT候选');const rect=rail.artRect,z=550/rect[2],crop=document.createElement('div');crop.className='crop';crop.style.width=rect[2]*z+'px';crop.style.height=rect[3]*z+'px';const image=new Image();image.src=rail.candidate;Object.assign(image.style,{width:rail.candidateSize[0]*z+'px',height:rail.candidateSize[1]*z+'px',left:-rect[0]*z+'px',top:-rect[1]*z+'px'});crop.append(image);a.append(crop);
const calc=card(6,'认购计算器','GPT候选');const im=new Image();im.src=data.statics[1].candidate;calc.append(im);
pose(card(7,'法院选择高亮','原生矢量4倍'),'court-highlight',1,2.3);pose(card(8,'Ready 提示','原生矢量4倍'),'carnival-intro',0,1.3);pose(card(9,'Win 提示','原生矢量4倍'),'ludo-win',0,2.4);
const roads=card(10,'四方向路障','两朝向 × 亮灭态');pose(roads,'barrier-1',1,1.8);pose(roads,'barrier-2',0,1.8);
const mine=card(11,'地雷','三姿态');for(let i=0;i<3;i++)pose(mine,'mine',i,2.4);
const drops=card(12,'游乐场掉落物','银币 + 三种杂志');for(let i=1;i<=4;i++)pose(drops,'carnival-ball-'+i,0,2.3);
window.overviewReady=Promise.all([...document.images].map(i=>i.decode()));
</script>
